[project]
name = "samanvay-ai"
version = "0.1.0"
description = "AI-driven standardization and cross-CPSE material code harmonization engine combining industrial NER and deterministic ASME engineering rules."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "faker>=40.38.0",
    "fastapi>=0.141.1",
    "ipython>=9.17.1",
    "jupyter>=1.1.1",
    "kaggle>=2.2.4",
    "neo4j>=6.3.0",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "polars>=1.44.2",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
    "reddis>=1.0.1",
    "scipy>=1.18.1",
    "scrapy>=2.19.0",
    "selenium>=4.49.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "xgboost>=3.4.1",
    "torch",
    "torchvision",
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "ruff>=0.16.7",
    "transformers>=5.17.0",
    "sentence-transformers>=6.0.1",
    "datasets>=5.0.1",
    "accelerate>=1.15.0",
    "scikit-learn>=1.9.1",
    "pdfplumber>=0.11.10",
    "winocr>=0.0.15",
    "paddleocr>=2.10.0",
    "qrcode>=8.2",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

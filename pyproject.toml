[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samanvay-ai"
version = "0.1.0"
description = "Cross-CPSE material-code harmonization engine"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "polars>=1.5,<2",
  "numpy>=2.0,<3",
  "pymupdf>=1.24,<2",
  "qdrant-client>=1.11,<2",
  "neo4j>=5.24,<6",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
ml = [
  "paddleocr>=3.3,<4",
  "paddlepaddle>=3,<4",
  "easyocr>=1.7,<2",
  "pillow>=10,<13",
  "sentence-transformers>=3.1,<4",
  "transformers>=4.45,<5",
  "datasets>=3,<4",
  "seqeval>=1.2,<2",
  "xgboost>=2.1,<4",
]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["OCR*", "backend*", "machine_learning*"]

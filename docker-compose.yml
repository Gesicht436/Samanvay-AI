name: samanvay-ai

services:
  # ── PostgreSQL 16 (Samanvay-AI Master Relational & Audit Ledger) ───────────
  postgres:
    image: samanvay-ai/postgres:16-alpine
    build:
      context: ./docker
      dockerfile_inline: |
        FROM postgres:16-alpine
        LABEL project="Samanvay-AI"
        LABEL org.opencontainers.image.title="Samanvay-AI Relational Ledger"
        LABEL org.opencontainers.image.vendor="MoPNG / BharatCodex"
        LABEL org.opencontainers.image.version="2.0.0-PROD"
    container_name: samanvay-ai-postgres
    hostname: samanvay-ai-postgres
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=16MB"
      - "-c"
      - "max_connections=50"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-samanvay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-samanvay_secure}
      POSTGRES_DB: ${POSTGRES_DB:-samanvay_db}
    ports:
      - "5432:5432"
    volumes:
      - samanvay-ai-postgres-data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-samanvay} -d ${POSTGRES_DB:-samanvay_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 160m
    cpus: 0.75
    networks:
      samanvay-ai-network:
        aliases:
          - samanvay-ai-postgres
          - postgres
    labels:
      project: "Samanvay-AI"
      service: "postgres"
      tier: "relational-database"

  # ── Qdrant Vector Engine (BAAI/bge-m3 HNSW Cosine Index) ───────────────────
  qdrant:
    image: samanvay-ai/qdrant:v1.12.0
    build:
      context: ./docker
      dockerfile_inline: |
        FROM qdrant/qdrant:v1.12.0
        LABEL project="Samanvay-AI"
        LABEL org.opencontainers.image.title="Samanvay-AI Vector Engine"
        LABEL org.opencontainers.image.vendor="MoPNG / BharatCodex"
        LABEL org.opencontainers.image.version="2.0.0-PROD"
    container_name: samanvay-ai-qdrant
    hostname: samanvay-ai-qdrant
    restart: unless-stopped
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
      - QDRANT__SERVICE__MAX_REQUEST_SIZE_MB=32
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - samanvay-ai-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 220m
    cpus: 0.75
    networks:
      samanvay-ai-network:
        aliases:
          - samanvay-ai-qdrant
          - qdrant
    labels:
      project: "Samanvay-AI"
      service: "qdrant"
      tier: "vector-search"

  # ── Neo4j 5.20 (Property Star Knowledge Graph & Logistics Topology) ────────
  neo4j:
    image: samanvay-ai/neo4j:5.20
    build:
      context: ./docker
      dockerfile_inline: |
        FROM neo4j:5.20
        LABEL project="Samanvay-AI"
        LABEL org.opencontainers.image.title="Samanvay-AI Knowledge Graph"
        LABEL org.opencontainers.image.vendor="MoPNG / BharatCodex"
        LABEL org.opencontainers.image.version="2.0.0-PROD"
    container_name: samanvay-ai-neo4j
    hostname: samanvay-ai-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/samanvay_graph}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 128m
      NEO4J_dbms_memory_heap_max__size: 256m
      NEO4J_dbms_memory_pagecache_size: 64m
      NEO4J_dbms_jvm_additional: "-XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=45"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - samanvay-ai-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 580m
    cpus: 1.0
    networks:
      samanvay-ai-network:
        aliases:
          - samanvay-ai-neo4j
          - neo4j
    labels:
      project: "Samanvay-AI"
      service: "neo4j"
      tier: "graph-database"

  # ── Samanvay-AI Backend Gateway & Physics Core ─────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: samanvay-ai/backend:2.0.0-PROD
    container_name: samanvay-ai-backend
    hostname: samanvay-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      - POSTGRES_HOST=samanvay-ai-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-samanvay}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-samanvay_secure}
      - POSTGRES_DB=${POSTGRES_DB:-samanvay_db}
      - QDRANT_HOST=samanvay-ai-qdrant
      - QDRANT_PORT=6333
      - NEO4J_URI=bolt://samanvay-ai-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=samanvay_graph
      - APP_ENV=production
      - PYTHONUNBUFFERED=1
      - MALLOC_ARENA_MAX=2
      - ENABLE_EMBEDDED_CDC=true
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml
      - ./rules:/app/rules
      - ./graph:/app/graph
      - ./datasets:/app/datasets
      - ./scripts:/app/scripts
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 420m
    cpus: 1.0
    networks:
      samanvay-ai-network:
        aliases:
          - samanvay-ai-backend
          - backend
    labels:
      project: "Samanvay-AI"
      service: "backend"
      tier: "api-gateway"

  # ── Samanvay-AI Real-Time Change Data Capture (CDC) Worker ───────────────────
  # Optional: for distributed deployments where CDC runs as a dedicated microservice.
  # For single-node deployments, the embedded CDC worker inside backend handles this.
  cdc-worker:
    image: samanvay-ai/backend:2.0.0-PROD
    container_name: samanvay-ai-cdc
    hostname: samanvay-ai-cdc
    restart: unless-stopped
    profiles:
      - distributed
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=samanvay-ai-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-samanvay}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-samanvay_secure}
      - POSTGRES_DB=${POSTGRES_DB:-samanvay_db}
      - NEO4J_URI=bolt://samanvay-ai-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=samanvay_graph
      - APP_ENV=production
      - PYTHONUNBUFFERED=1
      - MALLOC_ARENA_MAX=2
    volumes:
      - ./backend:/app/backend
      - ./graph:/app/graph
      - ./scripts:/app/scripts
      - ./rules:/app/rules
      - ./ml:/app/ml
    command: ["python", "-m", "scripts.cdc_worker"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import psycopg2; from neo4j import GraphDatabase; exit(0)' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 160m
    cpus: 0.5
    networks:
      samanvay-ai-network:
        aliases:
          - samanvay-ai-cdc
          - cdc
    labels:
      project: "Samanvay-AI"
      service: "cdc-worker"
      tier: "event-streaming"

  # ── Samanvay-AI Industrial Web Portal & Command Center ─────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: samanvay-ai/frontend:2.0.0-PROD
    container_name: samanvay-ai-frontend
    hostname: samanvay-ai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=192
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 220m
    cpus: 0.75
    networks:
      samanvay-ai-network:
        aliases:
          - samanvay-ai-frontend
          - frontend
    labels:
      project: "Samanvay-AI"
      service: "frontend"
      tier: "user-interface"

volumes:
  samanvay-ai-postgres-data:
    name: samanvay-ai-postgres-data
  samanvay-ai-qdrant-data:
    name: samanvay-ai-qdrant-data
  samanvay-ai-neo4j-data:
    name: samanvay-ai-neo4j-data

networks:
  samanvay-ai-network:
    name: samanvay-ai-network
    driver: bridge

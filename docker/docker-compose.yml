name: samanvay-ai

# All secrets/vars live in docker/.env.docker — pass with:
#   docker compose -f docker/docker-compose.yml --env-file docker/.env.docker up -d --build

services:
  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: samanvay-ai-postgres
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=16MB"
      - "-c"
      - "max_connections=50"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - samanvay-ai-postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 160m
    cpus: 0.75
    networks:
      - samanvay-ai-network

  # ── Qdrant Vector Engine ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: samanvay-ai-qdrant
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__SERVICE__MAX_REQUEST_SIZE_MB: "32"
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: "2"
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - samanvay-ai-qdrant-data:/qdrant/storage
    healthcheck:
      # No curl/wget/bash in the minimal qdrant image — check /proc/net/tcp for port 6333 (hex 18BD)
      test: ["CMD-SHELL", "grep -q '18BD' /proc/net/tcp || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 220m
    cpus: 0.75
    networks:
      - samanvay-ai-network

  # ── Neo4j 5.20 ───────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.20
    container_name: samanvay-ai-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 128m
      NEO4J_dbms_memory_heap_max__size: 256m
      NEO4J_dbms_memory_pagecache_size: 64m
      NEO4J_dbms_jvm_additional: "-XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=45"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - samanvay-ai-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 580m
    cpus: 1.0
    networks:
      - samanvay-ai-network

  # ── Backend API Gateway & Physics Core ───────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: samanvay-ai/backend:2.0.0-PROD
    container_name: samanvay-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      POSTGRES_HOST: samanvay-ai-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      QDRANT_HOST: samanvay-ai-qdrant
      QDRANT_PORT: 6333
      NEO4J_URI: bolt://samanvay-ai-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      APP_ENV: production
      PYTHONUNBUFFERED: "1"
      MALLOC_ARENA_MAX: "2"
      ENABLE_EMBEDDED_CDC: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 420m
    cpus: 1.0
    networks:
      - samanvay-ai-network

  # ── Frontend Web Portal ───────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    image: samanvay-ai/frontend:2.0.0-PROD
    container_name: samanvay-ai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      INTERNAL_BACKEND_URL: http://samanvay-ai-backend:8000
      NEXT_PUBLIC_API_URL: /api/v1
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 220m
    cpus: 0.75
    networks:
      - samanvay-ai-network

  # ── Cloudflare Tunnel (optional: --profile tunnel) ────────────────────────
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: samanvay-ai-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command: ["tunnel", "--url", "http://samanvay-ai-frontend:3000"]
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - samanvay-ai-network

  # ── Distributed CDC Worker (optional: --profile distributed) ─────────────
  # Default single-node deploy uses the embedded CDC inside the backend
  # (ENABLE_EMBEDDED_CDC=true). Only enable this for multi-node deployments.
  cdc-worker:
    image: samanvay-ai/backend:2.0.0-PROD
    container_name: samanvay-ai-cdc
    restart: unless-stopped
    profiles:
      - distributed
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      POSTGRES_HOST: samanvay-ai-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      NEO4J_URI: bolt://samanvay-ai-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      APP_ENV: production
      PYTHONUNBUFFERED: "1"
      MALLOC_ARENA_MAX: "2"
      ENABLE_EMBEDDED_CDC: "false"
    command: ["python", "-m", "scripts.cdc_worker"]
    mem_limit: 160m
    cpus: 0.5
    networks:
      - samanvay-ai-network

volumes:
  samanvay-ai-postgres-data:
    name: samanvay-ai-postgres-data
  samanvay-ai-qdrant-data:
    name: samanvay-ai-qdrant-data
  samanvay-ai-neo4j-data:
    name: samanvay-ai-neo4j-data

networks:
  samanvay-ai-network:
    driver: bridge

# ==============================================================================
# Samanvay-AI: Enterprise Production Hardened Orchestration Specification
# Compliant with MoPNG Sovereign Security Directives & CIS Docker Benchmarks
# Usage:
#   docker compose -f docker/docker-compose.yml --env-file docker/.env.docker up -d --build
# ==============================================================================

name: samanvay-ai

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

x-security: &default-security
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - "ALL"

services:
  # ── PostgreSQL 16 Relational Master Ledger ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: samanvay-ai-postgres
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=32MB"
      - "-c"
      - "max_connections=60"
      - "-c"
      - "checkpoint_completion_target=0.9"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - samanvay-ai-postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 384M
        reservations:
          cpus: "0.25"
          memory: 160M
    stop_grace_period: 45s
    security_opt:
      - "no-new-privileges:true"
    logging: *default-logging
    networks:
      - internal-data-net

  # ── Qdrant Vector Engine ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: samanvay-ai-qdrant
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__SERVICE__MAX_REQUEST_SIZE_MB: "32"
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: "2"
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - samanvay-ai-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "(grep -q '18BD' /proc/net/tcp 2>/dev/null || grep -q '18BD' /proc/net/tcp6 2>/dev/null) || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 220M
    stop_grace_period: 30s
    security_opt:
      - "no-new-privileges:true"
    logging: *default-logging
    networks:
      - internal-data-net

  # ── Neo4j 5.20 Graph Engine ───────────────────────────────────────────────
  neo4j:
    image: neo4j:5.20
    container_name: samanvay-ai-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 128m
      NEO4J_dbms_memory_heap_max__size: 384m
      NEO4J_dbms_memory_pagecache_size: 128m
      NEO4J_dbms_jvm_additional: "-XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=45"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - samanvay-ai-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 768M
        reservations:
          cpus: "0.50"
          memory: 400M
    stop_grace_period: 45s
    security_opt:
      - "no-new-privileges:true"
    logging: *default-logging
    networks:
      - internal-data-net

  # ── FastAPI Application Core & ML Engine ──────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: samanvay-ai/backend:2.0.0-PROD
    container_name: samanvay-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      POSTGRES_HOST: samanvay-ai-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      QDRANT_HOST: samanvay-ai-qdrant
      QDRANT_PORT: 6333
      NEO4J_URI: bolt://samanvay-ai-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      APP_ENV: production
      PYTHONUNBUFFERED: "1"
      MALLOC_ARENA_MAX: "2"
      ENABLE_EMBEDDED_CDC: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).getcode() == 200 else 1)"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 12s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 768M
        reservations:
          cpus: "0.50"
          memory: 384M
    stop_grace_period: 30s
    <<: *default-security
    logging: *default-logging
    networks:
      - application-net
      - internal-data-net

  # ── Next.js 16 Web Portal (Standalone) ───────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    image: samanvay-ai/frontend:2.0.0-PROD
    container_name: samanvay-ai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      INTERNAL_BACKEND_URL: http://samanvay-ai-backend:8000
      NEXT_PUBLIC_API_URL: /api/v1
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 384M
        reservations:
          cpus: "0.25"
          memory: 160M
    stop_grace_period: 15s
    <<: *default-security
    logging: *default-logging
    networks:
      - public-ingress-net
      - application-net

  # ── Cloudflare Tunnel (optional: --profile tunnel) ────────────────────────
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: samanvay-ai-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command: ["tunnel", "--url", "http://samanvay-ai-frontend:3000"]
    depends_on:
      frontend:
        condition: service_healthy
    logging: *default-logging
    networks:
      - public-ingress-net

  # ── Distributed CDC Worker (optional: --profile distributed) ─────────────
  cdc-worker:
    image: samanvay-ai/backend:2.0.0-PROD
    container_name: samanvay-ai-cdc
    restart: unless-stopped
    profiles:
      - distributed
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      POSTGRES_HOST: samanvay-ai-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      NEO4J_URI: bolt://samanvay-ai-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      APP_ENV: production
      PYTHONUNBUFFERED: "1"
      MALLOC_ARENA_MAX: "2"
      ENABLE_EMBEDDED_CDC: "false"
    command: ["python", "-m", "scripts.cdc_worker"]
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
        reservations:
          cpus: "0.20"
          memory: 120M
    stop_grace_period: 30s
    <<: *default-security
    logging: *default-logging
    networks:
      - internal-data-net

volumes:
  samanvay-ai-postgres-data:
    name: samanvay-ai-postgres-data
  samanvay-ai-qdrant-data:
    name: samanvay-ai-qdrant-data
  samanvay-ai-neo4j-data:
    name: samanvay-ai-neo4j-data

networks:
  public-ingress-net:
    driver: bridge
    name: samanvay-public-ingress
  application-net:
    driver: bridge
    name: samanvay-app-mesh
  internal-data-net:
    driver: bridge
    internal: true
    name: samanvay-internal-secure-data

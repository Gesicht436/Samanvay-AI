version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: samanvay_postgres
    environment:
      POSTGRES_USER: samanvay
      POSTGRES_PASSWORD: samanvay_secure
      POSTGRES_DB: samanvay_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: samanvay_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  neo4j:
    image: neo4j:5.20
    container_name: samanvay_neo4j
    environment:
      NEO4J_AUTH: neo4j/samanvay_graph
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: always

  backend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
    container_name: samanvay_backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant
      - neo4j
    environment:
      - DATABASE_URL=postgresql://samanvay:samanvay_secure@postgres:5432/samanvay_db
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=samanvay_graph
    volumes:
      - ../backend:/app/backend
      - ../ml:/app/ml
      - ../rules:/app/rules
      - ../graph:/app/graph
    restart: always

  frontend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.frontend
    container_name: samanvay_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    restart: always

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
